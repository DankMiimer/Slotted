name: Publication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p test_publication.py
      - run: python -m unittest discover -s tests -p test_frontend_prepare.py
      - run: python -m unittest discover -s tests -p test_slotted_standalone.py
      - run: python -m unittest discover -s tests -p test_slotted_install.py
      - run: python -m unittest discover -s tests -p test_native_room.py
      - run: python -m tools.publication.export --output build/ci-publication
      - run: python -m tools.publication.export --verify build/ci-publication
